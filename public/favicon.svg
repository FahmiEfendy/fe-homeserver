<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Home roof / shape outline -->
  <path d="M16 3 L3 13 V27 A2 2 0 0 0 5 29 H27 A2 2 0 0 0 29 27 V13 Z" fill="none" stroke="url(#brand-grad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
  <!-- Server horizontal slots inside the house -->
  <rect x="8" y="12" width="16" height="3" rx="1" fill="#222" stroke="url(#brand-grad)" stroke-width="1" />
  <rect x="8" y="17" width="16" height="3" rx="1" fill="#222" stroke="url(#brand-grad)" stroke-width="1" />
  <rect x="8" y="22" width="16" height="3" rx="1" fill="#222" stroke="url(#brand-grad)" stroke-width="1" />
  <!-- LED lights in server slots -->
  <circle cx="11" cy="13.5" r="0.75" fill="#22c55e" filter="url(#glow)" />
  <circle cx="11" cy="18.5" r="0.75" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="11" cy="23.5" r="0.75" fill="#a855f7" filter="url(#glow)" />
  <!-- Activity bar indications -->
  <line x1="15" y1="13.5" x2="21" y2="13.5" stroke="#22c55e" stroke-width="0.75" stroke-linecap="round" opacity="0.8" />
  <line x1="15" y1="18.5" x2="20" y2="18.5" stroke="#3b82f6" stroke-width="0.75" stroke-linecap="round" opacity="0.8" />
  <line x1="15" y1="23.5" x2="22" y2="23.5" stroke="#a855f7" stroke-width="0.75" stroke-linecap="round" opacity="0.8" />
</svg>
